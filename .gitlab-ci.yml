stages:
  - build
#   - deploy


variables:
  namecb: "brdeui"






#------------------------- 北京DEV测试环境发布start
dev-build:
  stage: build
  variables:
    DOCKER_HOST: tcp://172.22.65.53:2375/
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    #GIT_SUBMODULE_STRATEGY: recursive
  before_script:
    - docker login ${REGISTRY_URL} -u "$DOCKER_USER" -p "$DOCKER_PASS"
  script:
    - CI_COMMIT_TAG=$(cat version)
    - docker build --network host --cache-from ${REGISTRY_URL}/${REGISTRY_NS}/${namecb}:latest --tag ${REGISTRY_URL}/${REGISTRY_NS}/${namecb}:dev .
    - docker push ${REGISTRY_URL}/${REGISTRY_NS}/${namecb}:dev
  after_script:
    - docker logout ${REGISTRY_URL}
  tags:
    - "docker"
  only:
    changes:
      - version
    refs:
      - devel
  except:
    - tags



